name: Build Python Portable

on:
  push:
    branches: [main, master]
  workflow_dispatch:  # Permite ejecutar manualmente desde la interfaz de GitHub

jobs:
  build-portable:
    runs-on: windows-latest
    
    steps:
      # 1. Checkout del código
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Descargar Python 3.11 Embedded (64-bit)
      - name: Download Python 3.11 Embedded
        shell: pwsh
        run: |
          $pythonUrl = "https://www.python.org/ftp/python/3.11.9/python-3.11.9-embed-amd64.zip"
          $outputPath = "python-embedded.zip"
          
          Write-Host "Descargando Python 3.11 Embedded..."
          Invoke-WebRequest -Uri $pythonUrl -OutFile $outputPath
          
          Write-Host "Extrayendo Python Embedded..."
          Expand-Archive -Path $outputPath -DestinationPath "python-portable" -Force
          
          Write-Host "Contenido extraído:"
          Get-ChildItem "python-portable"

      # 3. Configurar pip en Python Embedded
      # El archivo python311._pth necesita 'import site' para que pip funcione
      - name: Configure pip for Embedded Python
        shell: pwsh
        run: |
          $pthFile = "python-portable/python311._pth"
          
          # Leer contenido actual
          $content = Get-Content $pthFile -Raw
          Write-Host "Contenido original de python311._pth:"
          Write-Host $content
          
          # Agregar 'import site' si no existe
          if ($content -notmatch "import site") {
              Add-Content -Path $pthFile -Value "`r`nimport site"
              Write-Host "Agregado 'import site' a python311._pth"
          }
          
          # Descargar get-pip.py
          Write-Host "Descargando get-pip.py..."
          Invoke-WebRequest -Uri "https://bootstrap.pypa.io/get-pip.py" -OutFile "python-portable/get-pip.py"
          
          # Instalar pip
          Write-Host "Instalando pip..."
          & "python-portable/python.exe" "python-portable/get-pip.py" --no-warn-script-location
          
          Write-Host "Pip instalado. Verificando..."
          & "python-portable/python.exe" -m pip --version

      # 4. Actualizar pip, setuptools y wheel
      - name: Upgrade pip tools
        shell: pwsh
        run: |
          & "python-portable/python.exe" -m pip install --upgrade pip setuptools wheel --no-warn-script-location

      # 5. Instalar dependencias desde requirements.txt
      - name: Install requirements
        shell: pwsh
        run: |
          # Verificar que existe requirements.txt
          if (Test-Path "requirements.txt") {
              Write-Host "Instalando dependencias desde requirements.txt..."
              & "python-portable/python.exe" -m pip install -r requirements.txt --no-warn-script-location
          } else {
              Write-Error "No se encontró requirements.txt en la raíz del repositorio"
              exit 1
          }

      # 6. Verificar instalación de paquetes críticos
      - name: Verify critical packages
        shell: pwsh
        run: |
          $packages = @(
              "jinja2",
              "pymssql", 
              "mysql.connector",
              "fastapi",
              "dictor",
              "sqlalchemy",
              "requests",
              "cryptography",
              "dateutil",
              "dotenv",
              "jenkins",
              "yaml",
              "pytz",
              "pydantic",
              "pyodbc",
              "psycopg2"
          )
          
          foreach ($pkg in $packages) {
              Write-Host "Verificando $pkg..."
              & "python-portable/python.exe" -c "import $pkg; print('$pkg OK -', $pkg.__version__)" 
          }

      # 7. Limpiar archivos temporales
      - name: Clean temporary files
        shell: pwsh
        run: |
          # Eliminar get-pip.py
          Remove-Item "python-portable/get-pip.py" -ErrorAction SilentlyContinue
          
          # Eliminar archivos de cache de pip
          Remove-Item "python-portable/python-embedded.zip" -ErrorAction SilentlyContinue
          Get-ChildItem "python-portable" -Recurse -Filter "__pycache__" | Remove-Item -Recurse -Force -ErrorAction SilentlyContinue
          
          # Opcional: Eliminar archivos de test/documentación de librerías para reducir tamaño
          # Get-ChildItem "python-portable/Lib/site-packages" -Recurse -Filter "tests" | Remove-Item -Recurse -Force -ErrorAction SilentlyContinue
          # Get-ChildItem "python-portable/Lib/site-packages" -Recurse -Filter "*.dist-info" | Remove-Item -Recurse -Force -ErrorAction SilentlyContinue

      # 8. Crear script de inicio (opcional pero recomendado)
      - name: Create launcher scripts
        shell: pwsh
        run: |
          # Crear un script batch para facilitar el uso
          @"
          @echo off
          set PYTHONPATH=%~dp0\Lib\site-packages
          "%~dp0\python.exe" %*
          "@ | Set-Content "python-portable/python-portable.bat" -Encoding ASCII
          
          # Crear script PowerShell
          @"
          `$scriptPath = Split-Path -Parent `$MyInvocation.MyCommand.Path
          `$env:PYTHONPATH = Join-Path `$scriptPath "Lib\site-packages"
          & (Join-Path `$scriptPath "python.exe") @args
          "@ | Set-Content "python-portable/python-portable.ps1" -Encoding UTF8
          
          Write-Host "Scripts de lanzamiento creados"

      # 9. Mostrar estructura final
      - name: Show final structure
        shell: pwsh
        run: |
          Write-Host "Estructura del Python Portable:"
          Get-ChildItem "python-portable" -Recurse | 
              Select-Object FullName, Length | 
              Sort-Object FullName | 
              Format-Table -AutoSize
          
          $size = (Get-ChildItem "python-portable" -Recurse | Measure-Object -Property Length -Sum).Sum / 1MB
          Write-Host ("Tamaño total: {0:N2} MB" -f $size)

      # 10. Subir como Artifact de GitHub
      - name: Upload Portable Python Artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-3.11-portable-with-dependencies
          path: python-portable/
          retention-days: 30  # Días que se conservará el artifact
          compression-level: 6  # Nivel de compresión (0-9)