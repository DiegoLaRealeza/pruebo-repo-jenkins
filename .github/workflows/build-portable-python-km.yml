name: Build Python Portable KM

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-portable-linux:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout del repositorio
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Instalar dependencias del sistema necesarias para compilar Python y paquetes nativos
      - name: Install system build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libssl-dev \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libreadline-dev \
            libsqlite3-dev \
            libgdbm-dev \
            libdb5.3-dev \
            libbz2-dev \
            libexpat1-dev \
            liblzma-dev \
            libffi-dev \
            uuid-dev \
            tk-dev \
            libpq-dev \
            unixodbc-dev \
            freetds-dev \
            libkrb5-dev \
            wget \
            ca-certificates

      # 3. Descargar y extraer fuentes de Python 3.11.9
      - name: Download Python 3.11 source
        run: |
          PYTHON_VERSION="3.11.9"
          wget -q "https://www.python.org/ftp/python/${PYTHON_VERSION}/Python-${PYTHON_VERSION}.tgz"
          tar -xzf "Python-${PYTHON_VERSION}.tgz"
          echo "PYTHON_SRC=Python-${PYTHON_VERSION}" >> $GITHUB_ENV

      # 4. Compilar Python con prefix local (portable)
      - name: Compile Python 3.11 (portable prefix)
        run: |
          INSTALL_PREFIX="${GITHUB_WORKSPACE}/python-portable"
          mkdir -p "$INSTALL_PREFIX"

          cd "$PYTHON_SRC"
          
          ./configure \
            --prefix="$INSTALL_PREFIX" \
            --enable-optimizations \
            --with-ensurepip=no \
            --enable-shared \
            LDFLAGS="-Wl,-rpath,\$$ORIGIN/../lib"

          make -j$(nproc)
          make install

          echo "PYTHON_PREFIX=$INSTALL_PREFIX" >> $GITHUB_ENV

      # 5. Instalar pip manualmente en el Python portable
      - name: Install pip into portable Python
        run: |
          "$PYTHON_PREFIX/bin/python3.11" -m ensurepip --upgrade
          "$PYTHON_PREFIX/bin/python3.11" -m pip install --upgrade pip setuptools wheel

      # 6. Instalar requirements.txt en el Python portable
      - name: Install requirements
        run: |
          "$PYTHON_PREFIX/bin/python3.11" -m pip install -r requirements.txt

      # 7. Verificar instalación de paquetes críticos
      - name: Verify critical packages
        run: |
          PYTHON="$PYTHON_PREFIX/bin/python3.11"
          
          $PYTHON -c "import jinja2; print('Jinja2:', jinja2.__version__)"
          $PYTHON -c "import pymssql; print('pymssql OK')"
          $PYTHON -c "import mysql.connector; print('mysql-connector OK')"
          $PYTHON -c "import fastapi; print('FastAPI:', fastapi.__version__)"
          $PYTHON -c "import dictor; print('dictor OK')"
          $PYTHON -c "import sqlalchemy; print('SQLAlchemy:', sqlalchemy.__version__)"
          $PYTHON -c "import requests; print('requests:', requests.__version__)"
          $PYTHON -c "import cryptography; print('cryptography:', cryptography.__version__)"
          $PYTHON -c "import dateutil; print('python-dateutil OK')"
          $PYTHON -c "import dotenv; print('python-dotenv OK')"
          $PYTHON -c "import jenkins; print('python-jenkins OK')"
          $PYTHON -c "import yaml; print('PyYAML OK')"
          $PYTHON -c "import pytz; print('pytz:', pytz.__version__)"
          $PYTHON -c "import pydantic; print('pydantic:', pydantic.__version__)"
          $PYTHON -c "import pyodbc; print('pyodbc OK')"
          $PYTHON -c "import psycopg2; print('psycopg2-binary OK')"

      # 8. Crear scripts de activación y launcher
      - name: Create activation scripts
        run: |
          # Script de activación tipo virtualenv
          cat > "$PYTHON_PREFIX/activate" << 'EOF'
          #!/bin/bash
          # Script de activación para Python Portable
          export PYTHON_PORTABLE_ROOT="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
          export PATH="$PYTHON_PORTABLE_ROOT/bin:$PATH"
          export LD_LIBRARY_PATH="$PYTHON_PORTABLE_ROOT/lib:$LD_LIBRARY_PATH"
          export PYTHONHOME="$PYTHON_PORTABLE_ROOT"
          echo "Python Portable 3.11 activado"
          echo "Ejecuta: python3.11 -V"
          EOF
          chmod +x "$PYTHON_PREFIX/activate"

          # Script wrapper para facilitar uso
          cat > "$PYTHON_PREFIX/python-portable" << 'EOF'
          #!/bin/bash
          SCRIPT_DIR="$(cd "$(dirname "$0")" && pwd)"
          export LD_LIBRARY_PATH="$SCRIPT_DIR/lib:$LD_LIBRARY_PATH"
          export PYTHONHOME="$SCRIPT_DIR"
          exec "$SCRIPT_DIR/bin/python3.11" "$@"
          EOF
          chmod +x "$PYTHON_PREFIX/python-portable"

      # 9. Limpiar archivos innecesarios para reducir tamaño
      - name: Clean build artifacts
        run: |
          # Eliminar archivos de desarrollo/compilación
          rm -rf "$PYTHON_PREFIX/share/doc" "$PYTHON_PREFIX/share/man" || true
          find "$PYTHON_PREFIX" -type d -name "__pycache__" -exec rm -rf {} + 2>/dev/null || true
          find "$PYTHON_PREFIX" -type f -name "*.pyc" -delete 2>/dev/null || true
          find "$PYTHON_PREFIX" -type d -name "test" -exec rm -rf {} + 2>/dev/null || true
          find "$PYTHON_PREFIX" -type d -name "tests" -exec rm -rf {} + 2>/dev/null || true

      # 10. Empaquetar como tar.gz
      - name: Create portable tarball
        run: |
          tar -czf python-3.11-portable-linux.tar.gz python-portable/
          ls -lh python-3.11-portable-linux.tar.gz

      # 11. Subir como Artifact de GitHub
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-3.11-portable-linux
          path: python-3.11-portable-linux.tar.gz
          retention-days: 30