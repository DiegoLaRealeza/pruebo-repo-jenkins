name: Build Python Portable KM

on:
  push:
    branches: [main, master]
    paths:
      - 'requirements.txt'
      - '.github/workflows/build-portable-python-km.yml'
  workflow_dispatch:

jobs:
  build:
    name: Job 1 - Build (Construir el entorno portable)
    runs-on: ubuntu-latest
    steps:
      - name: Tarea 1.1.1 - Hacer checkout del repositorio
        uses: actions/checkout@v4

      - name: Tarea 1.1.2 a 1.1.6 - Preparar el Python standalone
        run: |
          echo "==> Descargando Python standalone 3.11.7..."
          curl -L -o python.tar.gz \
            "https://github.com/indygreg/python-build-standalone/releases/download/20240107/cpython-3.11.7+20240107-x86_64-unknown-linux-gnu-install_only.tar.gz"

          echo "==> Extrayendo el archivo tar.gz..."
          tar -xzf python.tar.gz

          echo "==> Localizando directorio extraído..."
          ls -la

          echo "==> Verificando/renombrando directorio a 'python'..."
          if [ -d "python" ]; then
            echo "Directorio 'python' encontrado."
          else
            EXTRACTED_DIR=$(ls -d cpython-* 2>/dev/null | head -n 1)
            if [ -n "$EXTRACTED_DIR" ]; then
              echo "Renombrando '$EXTRACTED_DIR' a 'python'..."
              mv "$EXTRACTED_DIR" python
            else
              echo "ERROR: No se encontró directorio python ni cpython-*"
              exit 1
            fi
          fi

          echo "==> Eliminando archivo comprimido descargado..."
          rm -f python.tar.gz

      - name: Tarea 1.2 - Crear wrappers portables para pip
        run: |
          echo "==> Creando directorio portable_env y copiando contenido..."
          mkdir -p portable_env
          cp -r python/* portable_env/

          echo "==> Descargando get-pip.py..."
          curl -L -o get-pip.py https://bootstrap.pypa.io/get-pip.py

          echo "==> Instalando pip con el Python standalone..."
          ./portable_env/bin/python3.11 get-pip.py

          echo "==> Eliminando get-pip.py..."
          rm -f get-pip.py

          echo "==> Eliminando scripts originales de pip (con rutas absolutas)..."
          rm -f portable_env/bin/pip
          rm -f portable_env/bin/pip3
          rm -f portable_env/bin/pip3.11

          echo "==> Creando script wrapper para pip..."
          cat > portable_env/bin/pip << 'EOF'
          #!/bin/bash
          "$(dirname "$0")/python3.11" -m pip "$@"
          EOF

          echo "==> Creando script wrapper para pip3..."
          cat > portable_env/bin/pip3 << 'EOF'
          #!/bin/bash
          "$(dirname "$0")/python3.11" -m pip "$@"
          EOF

          echo "==> Creando script wrapper para pip3.11..."
          cat > portable_env/bin/pip3.11 << 'EOF'
          #!/bin/bash
          "$(dirname "$0")/python3.11" -m pip "$@"
          EOF

          echo "==> Dando permisos de ejecución a los tres wrappers..."
          chmod +x portable_env/bin/pip
          chmod +x portable_env/bin/pip3
          chmod +x portable_env/bin/pip3.11

          echo "==> Creando enlace simbólico python -> python3.11..."
          ln -sf python3.11 portable_env/bin/python

      - name: Tarea 1.3 - Verificar e instalar dependencias
        run: |
          echo "==> Probando que el Python portable funciona..."
          ./portable_env/bin/python --version

          echo "==> Probando que el wrapper de pip funciona..."
          ./portable_env/bin/pip --version

          echo "==> Mostrando lista de paquetes instalados actualmente..."
          ./portable_env/bin/pip list

          echo "==> Actualizando pip a la última versión..."
          ./portable_env/bin/pip install --upgrade pip

          echo "==> Instalando dependencias desde requirements.txt..."
          if [ -f requirements.txt ]; then
            ./portable_env/bin/pip install -r requirements.txt
          else
            echo "ADVERTENCIA: No se encontró requirements.txt. Continuando sin instalar dependencias adicionales."
          fi

      - name: Tarea 1.4 - Validar y empaquetar
        run: |
          echo "==> Verificando que requests se instaló correctamente..."
          ./portable_env/bin/python -c "import requests; print('requests version:', requests.__version__)"

          echo "==> Probando importación de requests desde el Python portable..."
          ./portable_env/bin/python -c "import requests; print('requests importado correctamente desde:', requests.__file__)"

          echo "==> Empaquetando todo el directorio portable_env en python-env.tar.gz..."
          tar -czf python-env.tar.gz portable_env

      - name: Tarea 1.4.4 - Subir artifact de GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: python-env
          path: python-env.tar.gz
          retention-days: 7

  verify:
    name: Job 2 - Verify (Verificar en runner limpio)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Tarea 2.1.1 y 2.1.2 - Descargar artifact
        uses: actions/download-artifact@v4
        with:
          name: python-env
          path: ./downloaded-env

      - name: Tarea 2.1.3 a 2.1.5 - Extraer en /tmp/install
        run: |
          echo "==> Creando directorio /tmp/install..."
          mkdir -p /tmp/install

          echo "==> Extrayendo el contenido de python-env.tar.gz..."
          tar -xzf ./downloaded-env/python-env.tar.gz -C /tmp/install

          echo "==> Listando contenido de /tmp/install/portable_env/bin..."
          ls -la /tmp/install/portable_env/bin

      - name: Tarea 2.2 - Probar binarios básicos
        run: |
          echo "==> Ejecutando Python portable y mostrando versión..."
          /tmp/install/portable_env/bin/python --version

          echo "==> Ejecutando wrapper de pip y mostrando versión..."
          /tmp/install/portable_env/bin/pip --version

          echo "==> Listando todos los paquetes instalados..."
          /tmp/install/portable_env/bin/pip list

      - name: Tarea 2.3 - Probar importación de dependencias
        run: |
          echo "==> Importando requests y mostrando versión y ruta..."
          /tmp/install/portable_env/bin/python -c \
            "import requests; print('Versión:', requests.__version__); print('Ruta de archivo:', requests.__file__)"

      - name: Tarea 2.4 - Probar con script real
        run: |
          echo "==> Creando script test_script.py..."
          cat > /tmp/test_script.py << 'EOF'
          import requests
          import sys

          print(f"Ejecutable de Python en uso: {sys.executable}")
          print(f"Versión de Python: {sys.version}")

          try:
              response = requests.get("https://httpbin.org/json", timeout=5)
              print(f"Código de estado: {response.status_code}")
              data = response.json()
              title = data.get("slideshow", {}).get("title", "No encontrado")
              print(f"Título del slideshow: {title}")
          except Exception as e:
              print(f"Error en la petición: {e}")
              sys.exit(1)
          EOF

          echo "==> Ejecutando script de prueba..."
          /tmp/install/portable_env/bin/python /tmp/test_script.py

      - name: Tarea 2.5 - Reportar resultado final
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ] || [ "${{ job.status }}" == "in_progress" ]; then
            echo "✅ VERIFICACIÓN EXITOSA: El entorno portable funciona correctamente en un runner limpio."
          else
            echo "❌ VERIFICACIÓN FALLIDA: El entorno portable no funciona correctamente."
            exit 1
          fi