name: Build Python Portable KM

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-portable-env:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Python 3.11 standalone
        run: |
          PYTHON_URL="https://github.com/indygreg/python-build-standalone/releases/download/20240107/cpython-3.11.7+20240107-x86_64-unknown-linux-gnu-install_only.tar.gz"
          curl -L -o python-standalone.tar.gz "$PYTHON_URL"
          mkdir -p /tmp/python-standalone
          tar -xzf python-standalone.tar.gz -C /tmp/python-standalone
          /tmp/python-standalone/python/bin/python3 --version

      - name: Create portable virtualenv with --copies
        run: |
          /tmp/python-standalone/python/bin/python3 -m venv /tmp/python-env --copies
          /tmp/python-env/bin/python --version

      - name: Upgrade pip and install dependencies
        run: |
          /tmp/python-env/bin/python -m pip install --upgrade pip setuptools wheel
          if [ -f requirements.txt ]; then
            /tmp/python-env/bin/python -m pip install -r requirements.txt
          else
            echo "requests==2.31.0" > /tmp/requirements.txt
            /tmp/python-env/bin/python -m pip install -r /tmp/requirements.txt
          fi
          /tmp/python-env/bin/python -m pip list

      - name: Make environment relocatable
        run: |
          # Update virtualenv paths to be relative for portability
          VENV_PATH="/tmp/python-env"

          # Remove absolute paths from activate scripts
          sed -i "s|$VENV_PATH|/tmp/install|g" $VENV_PATH/bin/activate 2>/dev/null || true
          sed -i "s|$VENV_PATH|/tmp/install|g" $VENV_PATH/bin/activate.csh 2>/dev/null || true
          sed -i "s|$VENV_PATH|/tmp/install|g" $VENV_PATH/bin/activate.fish 2>/dev/null || true

          # Update shebangs in bin scripts to use relative python
          for f in $VENV_PATH/bin/*; do
            if [ -f "$f" ] && head -n 1 "$f" | grep -q "^#!"; then
              sed -i "1s|#!$VENV_PATH/bin/|#!/tmp/install/bin/|" "$f" 2>/dev/null || true
            fi
          done

          # Make python binary directly usable
          chmod +x $VENV_PATH/bin/python* 2>/dev/null || true

      - name: Package portable environment
        run: |
          cd /tmp
          tar -czf python-env.tar.gz python-env
          ls -lh python-env.tar.gz

      - name: Upload portable environment artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-env
          path: /tmp/python-env.tar.gz
          retention-days: 30

  # Ejemplo de job consumidor que usa el entorno portable
  run-with-portable-env:
    needs: build-portable-env
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download portable environment
        uses: actions/download-artifact@v4
        with:
          name: python-env
          path: /tmp

      - name: Extract and test portable environment
        run: |
          cd /tmp
          tar -xzf python-env.tar.gz
          ls -la /tmp/python-env/bin/

          # Ejecutar Python con el entorno portable
          /tmp/python-env/bin/python --version
          /tmp/python-env/bin/python -m pip list

          # Ejecutar un script de prueba
          /tmp/python-env/bin/python -c "import requests; print(f'requests version: {requests.__version__}')"