name: Build portable Python DS

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'requirements.txt'
      - '.github/workflows/build-portable-python-ds.yml'

jobs:
  # JOB 1: Construir el entorno portable
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Descargar y extraer Python standalone
        run: |
          curl -L -o python-standalone.tar.gz \
            "https://github.com/indygreg/python-build-standalone/releases/download/20240107/cpython-3.11.7+20240107-x86_64-unknown-linux-gnu-install_only.tar.gz"
          tar -xzf python-standalone.tar.gz
          EXTRACTED_DIR=$(find . -maxdepth 1 -type d \( -name "python" -o -name "cpython-*" \) | head -1)
          if [ -z "$EXTRACTED_DIR" ]; then
            echo "Error: No se encontró el directorio extraído"
            exit 1
          fi
          if [ "$EXTRACTED_DIR" != "./python" ]; then
            mv "$EXTRACTED_DIR" python
          fi
          rm python-standalone.tar.gz
          echo "✅ Python standalone listo"

      - name: Crear entorno portable con wrappers
        run: |
          # Copiar Python standalone
          mkdir -p portable_env
          cp -r python/* portable_env/
          
          # Instalar pip manualmente
          curl -sS https://bootstrap.pypa.io/get-pip.py -o get-pip.py
          ./portable_env/bin/python3.11 get-pip.py --no-setuptools --no-wheel
          rm get-pip.py
          
          # Eliminar scripts pip originales (que tienen rutas absolutas)
          rm -f portable_env/bin/pip portable_env/bin/pip3 portable_env/bin/pip3.11
          
          # Crear wrappers portables
          cat > portable_env/bin/pip << 'EOF'
          #!/bin/sh
          DIR="$(cd "$(dirname "$0")" && pwd)"
          exec "$DIR/python3.11" -m pip "$@"
          EOF
          
          cat > portable_env/bin/pip3 << 'EOF'
          #!/bin/sh
          DIR="$(cd "$(dirname "$0")" && pwd)"
          exec "$DIR/python3.11" -m pip "$@"
          EOF
          
          cat > portable_env/bin/pip3.11 << 'EOF'
          #!/bin/sh
          DIR="$(cd "$(dirname "$0")" && pwd)"
          exec "$DIR/python3.11" -m pip "$@"
          EOF
          
          chmod +x portable_env/bin/pip portable_env/bin/pip3 portable_env/bin/pip3.11
          
          # Crear enlace simbólico python
          cd portable_env/bin
          ln -sf python3.11 python
          cd ../..
          
          echo "✅ Wrappers portables creados"

      - name: Verificar entorno localmente
        run: |
          echo "=== Prueba local ==="
          ./portable_env/bin/python --version
          ./portable_env/bin/pip --version
          ./portable_env/bin/pip list

      - name: Instalar dependencias
        run: |
          ./portable_env/bin/pip install --upgrade pip
          ./portable_env/bin/pip install -r requirements.txt

      - name: Verificar requests instalado
        run: |
          echo "=== Paquetes instalados ==="
          ./portable_env/bin/pip list | grep requests
          ./portable_env/bin/python -c "import requests; print(f'✅ requests {requests.__version__}')"

      - name: Empaquetar entorno
        run: tar -czf python-env.tar.gz portable_env/

      - name: Subir artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-env
          path: python-env.tar.gz
          retention-days: 7

  # JOB 2: Verificar en runner limpio
  verify:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Descargar artifact
        uses: actions/download-artifact@v4
        with:
          name: python-env
          path: ./downloaded-env

      - name: Extraer en /tmp/install
        run: |
          mkdir -p /tmp/install
          tar -xzf ./downloaded-env/python-env.tar.gz -C /tmp/install
          echo "=== Contenido del bin ==="
          ls -la /tmp/install/portable_env/bin/

      - name: Probar Python
        run: |
          echo "=== Versión de Python ==="
          /tmp/install/portable_env/bin/python --version

      - name: Probar pip con wrapper
        run: |
          echo "=== Versión de pip ==="
          /tmp/install/portable_env/bin/pip --version
          
          echo "=== Lista de paquetes ==="
          /tmp/install/portable_env/bin/pip list

      - name: Probar requests
        run: |
          echo "=== Probando requests ==="
          /tmp/install/portable_env/bin/python -c "
          import requests
          print(f'✅ requests version: {requests.__version__}')
          print(f'✅ requests path: {requests.__file__}')
          "

      - name: Probar con script real
        run: |
          cat > test_script.py << 'EOF'
          import requests
          import sys
          
          print(f"Python executable: {sys.executable}")
          print(f"Python version: {sys.version}")
          
          # Test HTTP request
          try:
              response = requests.get('https://httpbin.org/json', timeout=5)
              print(f"✅ HTTP request successful: {response.status_code}")
              data = response.json()
              print(f"✅ API response: {data['slideshow']['title']}")
          except Exception as e:
              print(f"❌ HTTP request failed: {e}")
              sys.exit(1)
          
          print("\n🎉 Entorno portable funciona perfectamente!")
          EOF
          
          /tmp/install/portable_env/bin/python test_script.py

      - name: Verificación exitosa
        if: success()
        run: |
          echo "🎉🎉🎉 VERIFICACIÓN EXITOSA 🎉🎉🎉"
          echo "El entorno portable funciona en /tmp/install"

      - name: Verificación fallida
        if: failure()
        run: |
          echo "❌❌❌ VERIFICACIÓN FALLIDA ❌❌❌"
          exit 1
