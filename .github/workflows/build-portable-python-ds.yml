name: Build portable Python DS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Descargar y extraer Python standalone
        run: |
          curl -L -o python-standalone.tar.gz \
            "https://github.com/indygreg/python-build-standalone/releases/download/20240107/cpython-3.11.7+20240107-x86_64-unknown-linux-gnu-install_only.tar.gz"
          tar -xzf python-standalone.tar.gz
          EXTRACTED_DIR=$(find . -maxdepth 1 -type d \( -name "python" -o -name "cpython-*" \) | head -1)
          if [ -z "$EXTRACTED_DIR" ]; then
            echo "Error: No se encontró el directorio extraído"
            exit 1
          fi
          if [ "$EXTRACTED_DIR" != "./python" ]; then
            mv "$EXTRACTED_DIR" python
          fi
          rm python-standalone.tar.gz
          echo "✅ Python standalone listo"

      - name: Crear virtualenv portable con pip manual
        run: |
          # Crear virtualenv sin pip (porque no hay ensurepip)
          ./python/bin/python3.11 -m venv --copies --without-pip portable_env
          # Descargar e instalar pip manualmente
          curl -sS https://bootstrap.pypa.io/get-pip.py -o get-pip.py
          ./portable_env/bin/python3.11 get-pip.py --no-setuptools --no-wheel
          rm get-pip.py
          echo "✅ Virtualenv creado con pip instalado"

      - name: Instalar dependencias
        run: |
          ./portable_env/bin/python3.11 -m pip install --upgrade pip
          ./portable_env/bin/python3.11 -m pip install -r requirements.txt

      - name: Empaquetar entorno
        run: tar -czf python-env.tar.gz portable_env/

      - name: Subir artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-env
          path: python-env.tar.gz
          retention-days: 7