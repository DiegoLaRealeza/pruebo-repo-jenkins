name: Build portable Python DS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repositorio (para obtener requirements.txt)
        uses: actions/checkout@v4

      - name: Descargar Python 3.11 standalone (versión fija)
        run: |
          curl -L -o python-standalone.tar.gz \
            "https://github.com/indygreg/python-build-standalone/releases/download/20240107/cpython-3.11.7+20240107-x86_64-unknown-linux-gnu-install_only.tar.gz"
          tar -xzf cpython-3.11.7+20240107-x86_64-unknown-linux-gnu-install_only.tar.gz
          # El directorio extraído tiene un nombre como "python" o similar
          # En este caso, el nombre será "cpython-3.11.7+20240107-x86_64-unknown-linux-gnu-install_only"
          EXTRACTED_DIR=$(find . -maxdepth 1 -type d -name "cpython-*" | head -1)
          if [ -z "$EXTRACTED_DIR" ]; then
            echo "Error: No se encontró el directorio extraído"
            exit 1
          fi
          mv "$EXTRACTED_DIR" python
          echo "📂 Python standalone listo en ./python"

      - name: Crear virtualenv portable (con --copies)
        run: |
          # El Python standalone ya es portable, pero creamos un venv para aislar dependencias
          ./python/bin/python -m venv --copies portable_env
          echo "✅ Virtualenv creado en ./portable_env"

      - name: Instalar dependencias dentro del virtualenv
        run: |
          ./portable_env/bin/python -m pip install --upgrade pip
          ./portable_env/bin/python -m pip install -r requirements.txt

      - name: Empaquetar el entorno completo
        run: |
          tar -czf python-env.tar.gz portable_env/
          echo "📦 Artículo generado: python-env.tar.gz"

      - name: Subir artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-env
          path: python-env.tar.gz
          retention-days: 7