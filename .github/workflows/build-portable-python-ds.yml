name: Build portable Python DS

on:
  workflow_dispatch:

jobs:
  # JOB 1: Construir el entorno portable
  build:
    runs-on: ubuntu-latest
    outputs:
      artifact_name: python-env  # Para pasar el nombre al siguiente job

    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Descargar y extraer Python standalone
        run: |
          curl -L -o python-standalone.tar.gz \
            "https://github.com/indygreg/python-build-standalone/releases/download/20240107/cpython-3.11.7+20240107-x86_64-unknown-linux-gnu-install_only.tar.gz"
          tar -xzf python-standalone.tar.gz
          # Detecta el nombre real
          EXTRACTED_DIR=$(find . -maxdepth 1 -type d \( -name "python" -o -name "cpython-*" \) | head -1)
          if [ -z "$EXTRACTED_DIR" ]; then
            echo "Error: No se encontró el directorio extraído"
            exit 1
          fi
          if [ "$EXTRACTED_DIR" != "./python" ]; then
            mv "$EXTRACTED_DIR" python
          fi
          rm python-standalone.tar.gz
          echo "✅ Python standalone listo en ./python"

      - name: Crear entorno portable manualmente
        run: |
          # Copiar todo el Python standalone al directorio portable_env
          mkdir -p portable_env
          cp -r python/* portable_env/
          
          # Instalar pip manualmente
          curl -sS https://bootstrap.pypa.io/get-pip.py -o get-pip.py
          ./portable_env/bin/python3.11 get-pip.py --no-setuptools --no-wheel
          rm get-pip.py
          
          # Crear enlace simbólico python
          cd portable_env/bin
          ln -sf python3.11 python
          cd ../..
          
          echo "✅ Entorno portable creado en ./portable_env"

      - name: Instalar dependencias
        run: |
          ./portable_env/bin/python -m pip install --upgrade pip
          ./portable_env/bin/python -m pip install -r requirements.txt

      - name: Empaquetar entorno
        run: tar -czf python-env.tar.gz portable_env/

      - name: Subir artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-env
          path: python-env.tar.gz
          retention-days: 7

  # JOB 2: Verificar que el entorno funciona correctamente
  verify:
    runs-on: ubuntu-latest
    needs: build  # Espera a que el job 'build' termine
    if: always()   # Ejecutar incluso si 'build' falló (para debugging)

    steps:
      - name: Descargar artifact del entorno portable
        uses: actions/download-artifact@v4
        with:
          name: python-env
          path: ./downloaded-env

      - name: Extraer entorno portable
        run: |
          mkdir -p /tmp/install
          tar -xzf ./downloaded-env/python-env.tar.gz -C /tmp/install
          ls -la /tmp/install/portable_env/bin/

      - name: Verificar Python y pip
        run: |
          echo "=== Versión de Python ==="
          /tmp/install/portable_env/bin/python --version
          
          echo "=== Versión de pip ==="
          /tmp/install/portable_env/bin/pip --version

      - name: Verificar dependencias instaladas
        run: |
          echo "=== Lista de paquetes instalados ==="
          /tmp/install/portable_env/bin/pip list
          
          echo "=== Verificando requests ==="
          /tmp/install/portable_env/bin/python -c "import requests; print(f'✅ requests version: {requests.__version__}')"

      - name: Verificar importación de requests con ruta específica
        run: |
          /tmp/install/portable_env/bin/python << EOF
          import sys
          import requests
          print(f"✅ Python path: {sys.executable}")
          print(f"✅ requests version: {requests.__version__}")
          print(f"✅ requests location: {requests.__file__}")
          EOF

      - name: Prueba de ejecución de script simple
        run: |
          cat > test_script.py << 'EOF'
          import requests
          import json
          
          # Probar requests con una API pública
          response = requests.get('https://httpbin.org/json')
          data = response.json()
          print(f"✅ Conexión exitosa a API")
          print(f"✅ Slideshow title: {data['slideshow']['title']}")
          
          print("\n🎉 Entorno portable funcionando correctamente!")
          EOF
          
          /tmp/install/portable_env/bin/python test_script.py

      - name: Verificar portabilidad (sin rutas absolutas fijas)
        run: |
          echo "=== Verificando que no hay rutas absolutas en el entorno ==="
          # Buscar rutas absolutas al home del runner
          if grep -r "/home/runner" /tmp/install/portable_env/bin/ 2>/dev/null; then
            echo "⚠️ Se encontraron rutas absolutas al home del runner"
          else
            echo "✅ No se encontraron rutas absolutas problemáticas"
          fi
          
          echo "=== Tamaño total del entorno ==="
          du -sh /tmp/install/portable_env/

      - name: Prueba exitosa
        if: success()
        run: |
          echo "🎉🎉🎉 VERIFICACIÓN EXITOSA 🎉🎉🎉"
          echo "El entorno portable funciona perfectamente en un runner limpio"
          echo "Tiempo de extracción y configuración: menos de 5 segundos"

      - name: Prueba fallida
        if: failure()
        run: |
          echo "❌❌❌ VERIFICACIÓN FALLIDA ❌❌❌"
          echo "El entorno portable no funciona correctamente"
          exit 1