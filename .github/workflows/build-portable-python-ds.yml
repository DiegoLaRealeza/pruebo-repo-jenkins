name: Build portable Python DS

on:
  workflow_dispatch:   # ejecución manual por ahora

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Instalar zstd
        run: sudo apt-get update && sudo apt-get install -y zstd

      - name: Descargar Python standalone (3.11.9)
        run: |
          wget -q https://github.com/indygreg/python-build-standalone/releases/download/20241002/cpython-3.11.9+20241002-x86_64-unknown-linux-gnu-pgo-full.tar.zst -O python.tar.zst

      - name: Extraer y preparar directorio portable
        run: |
          mkdir -p portable/install
          tar --zstd -xf python.tar.zst
          mv python/* portable/install/
          rm python.tar.zst

      - name: Crear virtualenv e instalar dependencias
        run: |
          portable/install/bin/python3 -m venv --copies portable/install/venv
          source portable/install/venv/bin/activate
          pip install --no-cache-dir -r requirements.txt
          deactivate

      - name: Empaquetar entorno
        run: |
          tar czf python-env.tar.gz -C portable install
          echo "Tamaño del paquete:"
          ls -lh python-env.tar.gz

      - name: Subir como artifact de GitHub
        uses: actions/upload-artifact@v4
        with:
          name: python-env              # nombre fijo, sin hash
          path: python-env.tar.gz
          retention-days: 30            # tiempo que se conserva el artifact