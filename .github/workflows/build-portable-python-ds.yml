name: Build portable Python DS

on:
  workflow_dispatch:

jobs:
  # JOB 1: Construir el entorno portable
  build:
    runs-on: ubuntu-latest
    outputs:
      artifact_name: python-env

    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Descargar y extraer Python standalone
        run: |
          curl -L -o python-standalone.tar.gz \
            "https://github.com/indygreg/python-build-standalone/releases/download/20240107/cpython-3.11.7+20240107-x86_64-unknown-linux-gnu-install_only.tar.gz"
          tar -xzf python-standalone.tar.gz
          EXTRACTED_DIR=$(find . -maxdepth 1 -type d \( -name "python" -o -name "cpython-*" \) | head -1)
          if [ -z "$EXTRACTED_DIR" ]; then
            echo "Error: No se encontró el directorio extraído"
            exit 1
          fi
          if [ "$EXTRACTED_DIR" != "./python" ]; then
            mv "$EXTRACTED_DIR" python
          fi
          rm python-standalone.tar.gz
          echo "✅ Python standalone listo"

      - name: Crear entorno portable con scripts relativos
        run: |
          # Copiar todo el Python standalone
          mkdir -p portable_env
          cp -r python/* portable_env/
          
          # Instalar pip manualmente
          curl -sS https://bootstrap.pypa.io/get-pip.py -o get-pip.py
          ./portable_env/bin/python3.11 get-pip.py --no-setuptools --no-wheel
          rm get-pip.py
          
          # CORRECCIÓN CRÍTICA: Hacer que los scripts pip usen rutas relativas
          cd portable_env/bin
          
          # Reemplazar el shebang de los scripts pip para que sean relativos
          for script in pip pip3 pip3.11; do
            if [ -f "$script" ]; then
              # Cambiar la primera línea de #!/ruta/absoluta a #!/usr/bin/env python3.11
              sed -i '1s|^#!.*python.*$|#!/usr/bin/env python3.11|' "$script"
              echo "✅ Corregido $script para usar env python3.11"
            fi
          done
          
          # Crear enlace simbólico python
          ln -sf python3.11 python
          cd ../..
          
          echo "✅ Entorno portable creado con scripts corregidos"

      - name: Verificar el entorno localmente
        run: |
          echo "=== Prueba local del entorno ==="
          ./portable_env/bin/python --version
          ./portable_env/bin/pip --version

      - name: Instalar dependencias
        run: |
          ./portable_env/bin/pip install --upgrade pip
          ./portable_env/bin/pip install -r requirements.txt

      - name: Empaquetar entorno
        run: tar -czf python-env.tar.gz portable_env/

      - name: Subir artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-env
          path: python-env.tar.gz
          retention-days: 7

  # JOB 2: Verificar que el entorno funciona correctamente
  verify:
    runs-on: ubuntu-latest
    needs: build
    if: always()

    steps:
      - name: Descargar artifact
        uses: actions/download-artifact@v4
        with:
          name: python-env
          path: ./downloaded-env

      - name: Extraer en /tmp/install
        run: |
          mkdir -p /tmp/install
          tar -xzf ./downloaded-env/python-env.tar.gz -C /tmp/install
          ls -la /tmp/install/portable_env/bin/

      - name: Verificar Python
        run: |
          echo "=== Versión de Python ==="
          /tmp/install/portable_env/bin/python --version

      - name: Verificar pip (debe funcionar ahora)
        run: |
          echo "=== Versión de pip ==="
          /tmp/install/portable_env/bin/pip --version

      - name: Verificar requests
        run: |
          echo "=== Verificando requests ==="
          /tmp/install/portable_env/bin/python -c "import requests; print(f'✅ requests version: {requests.__version__}')"

      - name: Probar script completo
        run: |
          cat > test.py << 'EOF'
          import requests
          import sys
          print(f"Python: {sys.executable}")
          print(f"requests version: {requests.__version__}")
          r = requests.get('https://httpbin.org/json')
          print(f"API response status: {r.status_code}")
          print("🎉 Todo funciona correctamente!")
          EOF
          
          /tmp/install/portable_env/bin/python test.py

      - name: Verificación exitosa
        if: success()
        run: |
          echo "🎉🎉🎉 VERIFICACIÓN EXITOSA 🎉🎉🎉"
          echo "El entorno portable funciona perfectamente"