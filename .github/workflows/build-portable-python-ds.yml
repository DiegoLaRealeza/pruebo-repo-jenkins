name: Build portable Python DS

on:
  workflow_dispatch:   # ejecución manual por ahora

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repositorio (para obtener requirements.txt)
        uses: actions/checkout@v4

      - name: Obtener URL de la última versión de Python 3.11 standalone (Linux x86_64)
        id: get_python_url
        run: |
          # Busca en los assets de la última release de indygreg/python-build-standalone
          LATEST_URL=$(curl -s https://api.github.com/repos/indygreg/python-build-standalone/releases/latest | \
            jq -r '.assets[] | select(.name | test("cpython-3\\.11\\..*-x86_64-unknown-linux-gnu-install_only\\.tar\\.gz")) | .browser_download_url' | \
            head -1)
          if [ -z "$LATEST_URL" ]; then
            echo "Error: No se encontró el asset de Python 3.11 para Linux x86_64"
            exit 1
          fi
          echo "url=$LATEST_URL" >> $GITHUB_OUTPUT
          echo "✅ URL obtenida: $LATEST_URL"

      - name: Descargar y extraer Python standalone
        run: |
          curl -L -o python-standalone.tar.gz "${{ steps.get_python_url.outputs.url }}"
          tar -xzf python-standalone.tar.gz
          # Renombrar el directorio extraído (tiene un nombre largo variable)
          EXTRACTED_DIR=$(find . -maxdepth 1 -type d -name "cpython-*" | head -1)
          if [ -z "$EXTRACTED_DIR" ]; then
            echo "Error: No se encontró el directorio extraído"
            exit 1
          fi
          mv "$EXTRACTED_DIR" python
          rm python-standalone.tar.gz
          echo "📂 Python standalone listo en ./python"

      - name: Instalar dependencias dentro del Python standalone
        run: |
          # Asegurar pip (ya viene incluido, pero por si acaso)
          ./python/bin/python -m ensurepip --upgrade
          ./python/bin/python -m pip install --upgrade pip
          # Instalar desde requirements.txt (ej. requests==2.31.0)
          ./python/bin/python -m pip install -r requirements.txt

      - name: Empaquetar el entorno completo
        run: |
          tar -czf python-env.tar.gz python/
          echo "📦 Artículo generado: python-env.tar.gz"

      - name: Subir artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-env
          path: python-env.tar.gz
          retention-days: 7       # tiempo que se conserva el artifact