name: Build portable Python environment

on:
  push:
    paths:
      - 'requirements.txt'      # se ejecuta automáticamente al modificar dependencias
  workflow_dispatch:            # permite ejecución manual desde la interfaz

jobs:
  build:
    runs-on: ubuntu-latest      # arquitectura x86_64, igual que tus runners efímeros
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install zstd
        run: sudo apt-get update && sudo apt-get install -y zstd

      - name: Download Python standalone (3.11.12)
        run: |
          wget -q https://github.com/indygreg/python-build-standalone/releases/download/20250416/cpython-3.11.12+20250416-x86_64-unknown-linux-gnu-pgo-full.tar.zst -O python.tar.zst

      - name: Extract and prepare portable directory
        run: |
          mkdir -p portable/install
          tar --zstd -xf python.tar.zst
          # El contenido extraído queda en ./python/, lo movemos a portable/install/
          mv python/* portable/install/
          rm python.tar.zst

      - name: Create virtualenv and install dependencies
        run: |
          # Crear un virtualenv autocontenido (--copies copia el intérprete, no usa enlaces simbólicos)
          portable/install/bin/python3 -m venv --copies portable/install/venv
          source portable/install/venv/bin/activate
          pip install --no-cache-dir -r requirements.txt
          deactivate

      - name: Compute hash of requirements.txt
        id: hash
        run: |
          HASH=$(sha256sum requirements.txt | cut -d ' ' -f1)
          echo "hash=$HASH" >> $GITHUB_OUTPUT
          echo "Requirements hash: $HASH"

      - name: Package the portable environment
        id: pack
        run: |
          ARCHIVE="python-env-${{ steps.hash.outputs.hash }}.tar.gz"
          tar czf "$ARCHIVE" -C portable install
          echo "archive=$ARCHIVE" >> $GITHUB_OUTPUT
          echo "Package size:"
          ls -lh "$ARCHIVE"

      - name: Upload as GitHub artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-env-${{ steps.hash.outputs.hash }}
          path: ${{ steps.pack.outputs.archive }}
          retention-days: 30   # ajusta según tu necesidad