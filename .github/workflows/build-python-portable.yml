name: Build Python Portable cgpt

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    name: Build portable Python
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Validar requirements.txt
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f requirements.txt ]; then
            echo "requirements.txt no existe. Creando requirements.txt por defecto."
            echo 'requests==2.31.0' > requirements.txt
          fi

          echo "Contenido de requirements.txt:"
          cat requirements.txt

      - name: Descargar y extraer Python standalone
        shell: bash
        run: |
          set -euo pipefail

          curl -L -o python-standalone.tar.gz \
            "https://github.com/indygreg/python-build-standalone/releases/download/20240107/cpython-3.11.7+20240107-x86_64-unknown-linux-gnu-install_only.tar.gz"

          tar -xzf python-standalone.tar.gz

          EXTRACTED_DIR="$(find . -maxdepth 1 -type d \( -name "python" -o -name "cpython-*" \) | head -1)"

          if [ -z "$EXTRACTED_DIR" ]; then
            echo "ERROR: No se encontró el directorio extraído."
            exit 1
          fi

          if [ "$EXTRACTED_DIR" != "./python" ]; then
            mv "$EXTRACTED_DIR" python
          fi

          rm python-standalone.tar.gz

          echo "Python standalone listo."

      - name: Crear entorno portable con wrappers
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p portable_env
          cp -r python/* portable_env/

          curl -sS https://bootstrap.pypa.io/get-pip.py -o get-pip.py
          ./portable_env/bin/python3.11 get-pip.py --no-setuptools --no-wheel
          rm get-pip.py

          rm -f portable_env/bin/pip portable_env/bin/pip3 portable_env/bin/pip3.11

          cat > portable_env/bin/pip << 'EOF'

          DIR="$(cd "$(dirname "$0")" && pwd)"
          exec "$DIR/python3.11" -m pip "$@"
          EOF

          cat > portable_env/bin/pip3 << 'EOF'
          DIR="$(cd "$(dirname "$0")" && pwd)"
          exec "$DIR/python3.11" -m pip "$@"
          EOF

          cat > portable_env/bin/pip3.11 << 'EOF'
          DIR="$(cd "$(dirname "$0")" && pwd)"
          exec "$DIR/python3.11" -m pip "$@"
          EOF

          chmod +x portable_env/bin/pip portable_env/bin/pip3 portable_env/bin/pip3.11

          cd portable_env/bin
          ln -sf python3.11 python
          cd ../..

          echo "Wrappers portables creados."

      - name: Verificar entorno localmente
        shell: bash
        run: |
          set -euo pipefail

          ./portable_env/bin/python --version
          ./portable_env/bin/pip --version
          ./portable_env/bin/pip list

      - name: Instalar dependencias
        shell: bash
        run: |
          set -euo pipefail

          ./portable_env/bin/pip install --upgrade pip
          ./portable_env/bin/pip install -r requirements.txt

      - name: Verificar dependencias instaladas
        shell: bash
        run: |
          set -euo pipefail

          ./portable_env/bin/pip list
          ./portable_env/bin/pip check

          ./portable_env/bin/python -c "import requests; print('requests version:', requests.__version__)"

      - name: Empaquetar entorno portable
        shell: bash
        run: |
          set -euo pipefail

          tar -czf python-env.tar.gz portable_env/

          echo "Artifact generado:"
          ls -lh python-env.tar.gz

      - name: Subir artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-env
          path: python-env.tar.gz
          retention-days: 7

  verify:
    name: Verify portable Python
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Descargar artifact
        uses: actions/download-artifact@v4
        with:
          name: python-env
          path: ./downloaded-env

      - name: Validar entorno portable
        shell: bash
        run: |
          set -euo pipefail

          rm -rf /tmp/install
          mkdir -p /tmp/install

          tar -xzf ./downloaded-env/python-env.tar.gz -C /tmp/install

          PYTHON_BIN="/tmp/install/portable_env/bin/python"
          PIP_BIN="/tmp/install/portable_env/bin/pip"

          test -x "$PYTHON_BIN"
          test -x "$PIP_BIN"

          "$PYTHON_BIN" --version
          "$PIP_BIN" --version
          "$PIP_BIN" check

          "$PYTHON_BIN" -c "import sys; print('Python executable:', sys.executable)"
          "$PYTHON_BIN" -c "import requests; print('requests version:', requests.__version__)"

          echo "Verificación correcta. El entorno portable funciona en /tmp/install/portable_env."