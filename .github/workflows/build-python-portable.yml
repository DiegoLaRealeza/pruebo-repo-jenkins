name: Build Python Portable cgpt

on:
  workflow_dispatch:
    inputs:
      python_minor:
        description: "Versión menor de Python a usar"
        required: true
        default: "3.11"
      pbs_release:
        description: "Release tag de astral-sh/python-build-standalone"
        required: true
        default: "20260510"

permissions:
  contents: read

env:
  PYTHON_MINOR: ${{ github.event.inputs.python_minor || '3.11' }}
  PBS_RELEASE: ${{ github.event.inputs.pbs_release || '20260510' }}
  PLATFORM: x86_64-unknown-linux-gnu
  INSTALL_ROOT: /tmp/install
  PORTABLE_DIR: /tmp/install/python-env
  ARTIFACT_FILE: python-env.tar.gz

jobs:
  build-python-portable:
    name: Build Python portable
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create requirements.txt if missing
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f requirements.txt ]; then
            echo "requirements.txt not found. Creating default requirements.txt"
            echo 'requests==2.31.0' > requirements.txt
          fi

          echo "requirements.txt content:"
          cat requirements.txt

      - name: Resolve python-build-standalone asset
        shell: bash
        run: |
          set -euo pipefail

          API_URL="https://api.github.com/repos/astral-sh/python-build-standalone/releases/tags/${PBS_RELEASE}"

          echo "Resolving Python asset from:"
          echo "$API_URL"

          curl -fsSL "$API_URL" -o release.json

          ASSET_NAME="$(python3 - <<'PY'
          import json
          import os
          import re
          import sys

          python_minor = os.environ["PYTHON_MINOR"]
          platform = os.environ["PLATFORM"]
          pbs_release = os.environ["PBS_RELEASE"]

          with open("release.json", "r", encoding="utf-8") as f:
              data = json.load(f)

          assets = data.get("assets", [])

          pattern = re.compile(
              rf"^cpython-{re.escape(python_minor)}\.\d+\+{re.escape(pbs_release)}-"
              rf"{re.escape(platform)}-install_only\.tar\.gz$"
          )

          matches = [a["name"] for a in assets if pattern.match(a.get("name", ""))]

          if not matches:
          print("No matching asset found.", file=sys.stderr)
          print("Expected pattern:", pattern.pattern, file=sys.stderr)
          print("Available similar assets:", file=sys.stderr)
          for a in assets:
          name = a.get("name", "")
          if f"cpython-{python_minor}." in name and platform in name and "install_only" in name:
              print(" -", name, file=sys.stderr)
          sys.exit(1)

          print(matches[0])
          PY
          )"

                    ASSET_URL="$(python3 - <<'PY'
          import json
          import os

          asset_name = os.environ["ASSET_NAME"]

          with open("release.json", "r", encoding="utf-8") as f:
              data = json.load(f)

          for asset in data.get("assets", []):
              if asset.get("name") == asset_name:
                  print(asset["browser_download_url"])
                  break
          else:
              raise SystemExit(f"Asset URL not found for {asset_name}")
          PY
          )"

          echo "ASSET_NAME=$ASSET_NAME" >> "$GITHUB_ENV"
          echo "ASSET_URL=$ASSET_URL" >> "$GITHUB_ENV"

          echo "Resolved asset:"
          echo "$ASSET_NAME"
          echo "$ASSET_URL"
        env:
          ASSET_NAME: ""

      - name: Download and extract standalone Python
        shell: bash
        run: |
          set -euo pipefail

          rm -rf "$INSTALL_ROOT"
          mkdir -p "$INSTALL_ROOT"

          echo "Downloading:"
          echo "$ASSET_URL"

          curl -fL "$ASSET_URL" -o python-standalone.tar.gz

          mkdir -p python-standalone
          tar -xzf python-standalone.tar.gz -C python-standalone

          echo "Extracted structure:"
          find python-standalone -maxdepth 3 -type f -name "python*" | sort | head -50

          PYTHON_BIN="$(find python-standalone -type f -path "*/bin/python3" | head -1)"

          if [ -z "$PYTHON_BIN" ]; then
            echo "python3 binary not found inside python-build-standalone archive"
            exit 1
          fi

          echo "Standalone Python:"
          "$PYTHON_BIN" --version

          echo "PYTHON_BIN=$PYTHON_BIN" >> "$GITHUB_ENV"

      - name: Create portable virtualenv
        shell: bash
        run: |
          set -euo pipefail

          rm -rf "$PORTABLE_DIR"
          mkdir -p "$INSTALL_ROOT"

          "$PYTHON_BIN" -m venv --copies "$PORTABLE_DIR"

          "$PORTABLE_DIR/bin/python" --version
          "$PORTABLE_DIR/bin/python" -m pip --version

      - name: Install dependencies into portable environment
        shell: bash
        run: |
          set -euo pipefail

          "$PORTABLE_DIR/bin/python" -m pip install --upgrade pip setuptools wheel
          "$PORTABLE_DIR/bin/python" -m pip install --no-cache-dir -r requirements.txt

          echo "Installed packages:"
          "$PORTABLE_DIR/bin/python" -m pip freeze

      - name: Validate portable environment
        shell: bash
        run: |
          set -euo pipefail

          "$PORTABLE_DIR/bin/python" - <<'PY'
          import sys
          import requests

          print("Python executable:", sys.executable)
          print("Python version:", sys.version)
          print("requests version:", requests.__version__)
          PY

      - name: Package portable Python environment
        shell: bash
        run: |
          set -euo pipefail

          cd "$INSTALL_ROOT"

          tar -czf "$GITHUB_WORKSPACE/$ARTIFACT_FILE" python-env

          cd "$GITHUB_WORKSPACE"

          echo "Generated artifact:"
          ls -lh "$ARTIFACT_FILE"

          echo "Artifact content sample:"
          tar -tzf "$ARTIFACT_FILE" | head -40

      - name: Upload portable Python artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-env-linux-x86_64
          path: python-env.tar.gz
          if-no-files-found: error
          retention-days: 7
          compression-level: 0